# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-osama"
BBFILE_PATTERN_meta-osama = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-osama = "6"

LAYERDEPENDS_meta-osama = "core"
LAYERSERIES_COMPAT_meta-osama = "kirkstone"
